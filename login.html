<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student & Staff Login – Campus Mart</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-store"></i></div>
                <span>Campus<span>Mart</span></span>
            </a>
            <div>
                <a href="index.html" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </header>

    <!-- Login Container -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h2>Welcome Back!</h2>
                <p>Sign in to order food, snacks, stationery & essentials</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="login-email">College Email Address</label>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="login-email" class="form-input" placeholder="student@college.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', 'pwd-toggle-icon')">
                            <i id="pwd-toggle-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" onclick="alert('For demo purposes: Please register a new student account or reset password via Firebase Console.'); return false;" style="color: var(--primary); font-weight: 600;">Forgot password?</a>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <!-- Quick Demo Tip for Viva Demonstration -->
            <div style="margin-top: 1.5rem; background: var(--bg-main); border: 1px dashed var(--border-color); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.82rem; color: var(--text-muted);">
                <div style="font-weight: 700; color: var(--secondary); margin-bottom: 0.25rem;">
                    <i class="fa-solid fa-lightbulb" style="color: var(--accent);"></i> Demo Notice:
                </div>
                New to the system? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create a student account</a> in seconds. Admins automatically redirect to dashboard on login.
            </div>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Sign Up Here</a>
            </div>
        </div>
    </main>

    <!-- Backend API & Auth Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
