<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Student & Staff Login – Campus Mart</title>
    <!-- Instant Startup Critical CSS & DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        /* Instant Cold Boot Paint (0ms White-Screen Eliminator) */
        :root { --primary: #ea580c; --bg-main: #f8fafc; }
        html, body { background-color: #f8fafc; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Inter, sans-serif; text-rendering: optimizeSpeed; }
        .navbar { background: #ffffff; min-height: 64px; }
    </style>
    <!-- Google Fonts with Swap -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Non-blocking Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"></noscript>
    <!-- Custom Core CSS -->
    <link rel="stylesheet" href="css/style.css?v=3.5">
    <!-- PWA & 1-Click Mobile App Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Campus Mart">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
</head>
<body>

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-store"></i></div>
                <span>Campus<span>Mart</span></span>
            </a>
            <div>
                <a href="index.html" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </header>

    <!-- Login Container -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fa-solid fa-store" id="login-header-icon"></i>
                </div>
                <h2 id="login-header-title">Welcome Back!</h2>
                <p id="login-header-subtitle">Sign in to order food, snacks, stationery & essentials</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <!-- Role Selector: Student vs Faculty vs Shop Owner -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" style="font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; display: block;">Login as:</label>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem;">
                        <label id="login-label-student" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.55rem 0.2rem; border: 2px solid var(--primary); background: #fff7ed; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.78rem; color: var(--primary); text-align: center; transition: all 0.2s ease;">
                            <input type="radio" name="login-role" id="login-role-student" value="Student" checked onchange="handleLoginRoleChange(this.value)" style="display: none;">
                            <i class="fa-solid fa-graduation-cap" style="font-size: 1.05rem;"></i>
                            <span>Student</span>
                        </label>

                        <label id="login-label-faculty" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.55rem 0.2rem; border: 1.5px solid #cbd5e1; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.78rem; color: #475569; text-align: center; transition: all 0.2s ease;">
                            <input type="radio" name="login-role" id="login-role-faculty" value="Faculty" onchange="handleLoginRoleChange(this.value)" style="display: none;">
                            <i class="fa-solid fa-chalkboard-user" style="font-size: 1.05rem;"></i>
                            <span>Faculty</span>
                        </label>

                        <label id="login-label-shop" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.55rem 0.2rem; border: 1.5px solid #cbd5e1; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.78rem; color: #475569; text-align: center; transition: all 0.2s ease;">
                            <input type="radio" name="login-role" id="login-role-shop" value="ShopOwner" onchange="handleLoginRoleChange(this.value)" style="display: none;">
                            <i class="fa-solid fa-store" style="font-size: 1.05rem;"></i>
                            <span>Shop</span>
                        </label>

                        <label id="login-label-delivery" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.55rem 0.2rem; border: 1.5px solid #cbd5e1; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.78rem; color: #475569; text-align: center; transition: all 0.2s ease;">
                            <input type="radio" name="login-role" id="login-role-delivery" value="Delivery" onchange="handleLoginRoleChange(this.value)" style="display: none;">
                            <i class="fa-solid fa-person-biking" style="font-size: 1.05rem;"></i>
                            <span>Delivery</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-email">College Email Address</label>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="login-email" class="form-input" placeholder="student@college.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', 'pwd-toggle-icon')">
                            <i id="pwd-toggle-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" onclick="alert('For demo purposes: Please register a new student account or reset password via Firebase Console.'); return false;" style="color: var(--primary); font-weight: 600;">Forgot password?</a>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <!-- Quick 1-Click Demo Login for Super Admin & Shop Owners -->
            <div style="margin-top: 1.25rem; background: #fff7ed; border: 1.5px dashed #ea580c; padding: 0.85rem 1rem; border-radius: 12px; font-size: 0.82rem;">
                <div style="font-weight: 700; color: #9a3412; margin-bottom: 0.45rem; display: flex; align-items: center; justify-content: space-between;">
                    <span><i class="fa-solid fa-bolt" style="color: #ea580c;"></i> 1-Click Quick Login:</span>
                    <span style="font-size: 0.7rem; background: #ea580c; color: white; padding: 1px 6px; border-radius: 10px; font-weight: 800;">AUTO-FILL</span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                    <button type="button" onclick="quickFillSuperAdmin()" class="btn btn-sm" style="background: #ea580c; color: white; font-size: 0.76rem; font-weight: 700; padding: 0.4rem 0.6rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(234,88,12,0.3);">
                        👑 Super Admin (Deepak)
                    </button>
                    <button type="button" onclick="quickFillVendor()" class="btn btn-sm" style="background: white; border: 1.5px solid #fed7aa; color: #9a3412; font-size: 0.76rem; font-weight: 700; padding: 0.4rem 0.6rem; border-radius: 8px;">
                        🏪 TMU Chole Kulcha
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Sign Up Here</a>
            </div>
        </div>
    </main>

    <!-- Backend API & Auth Scripts -->
    <script src="js/api.js?v=3.5"></script>
    <script src="js/auth.js?v=3.5"></script>
    <!-- PWA 1-Click Mobile App Installer -->
    <script src="js/pwa-install.js?v=3.5"></script>
</body>
</html>
